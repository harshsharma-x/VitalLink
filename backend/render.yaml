services:
  - type: web
    name: vitallink-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:socket_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vitallink-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        value: ""
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: vitallink-db
    databaseName: vitallink
    user: vitallink
