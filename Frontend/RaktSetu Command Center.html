<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VitalLink — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; background: #1A1A1F; }
  * { -webkit-font-smoothing: antialiased; box-sizing: border-box; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d8cfce; border-radius: 5px; border: 2px solid transparent; background-clip: content-box; }
  @keyframes rsPulse { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(2.6); opacity: 0; } }
  .rs-pulse { animation: rsPulse 1.7s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { .rs-pulse { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="raktsetu-dash-data.jsx"></script>
<script type="text/babel" src="raktsetu-dash-views.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function Sidebar({ active, onChange }) {
  return (
    <aside style={{
      width: 224, flexShrink: 0, background: D.sidebar, color: '#fff',
      display: 'flex', flexDirection: 'column', fontFamily: DFONT,
    }}>
      <div style={{ padding: '20px 18px 16px', display: 'flex', alignItems: 'center', gap: 10, borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
        <DDrop size={18} color={D.red} />
        <div>
          <div style={{ fontSize: 15, fontWeight: 800, letterSpacing: '-0.01em' }}>VitalLink</div>
          <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,0.5)', fontWeight: 600, letterSpacing: '0.04em' }}>COMMAND CENTER</div>
        </div>
      </div>

      <nav style={{ padding: '12px 10px', display: 'flex', flexDirection: 'column', gap: 2, flex: 1 }}>
        {Object.entries(DASH_VIEWS).map(([id, v]) => {
          const is = id === active;
          return (
            <button key={id} onClick={() => onChange(id)} style={{
              display: 'flex', alignItems: 'center', gap: 12, padding: '10px 12px', borderRadius: 9,
              border: 'none', cursor: 'pointer', textAlign: 'left', fontFamily: DFONT,
              background: is ? D.sidebarHi : 'transparent', color: is ? '#fff' : 'rgba(255,255,255,0.6)',
              transition: 'background 140ms',
            }}>
              <span style={{ width: 18, textAlign: 'center', fontSize: 14, color: is ? D.red : 'rgba(255,255,255,0.4)' }}>{v.icon}</span>
              <span style={{ fontSize: 13.5, fontWeight: is ? 700 : 500 }}>{v.label}</span>
              {id === 'fraud' && <span style={{ marginLeft: 'auto', fontSize: 10, fontWeight: 700, background: D.red, color: '#fff', borderRadius: 100, padding: '1px 7px' }}>2</span>}
              {id === 'emergencies' && <span style={{ marginLeft: 'auto' }}><DPulse color={D.red} size={6} /></span>}
            </button>
          );
        })}
      </nav>

      <div style={{ padding: '14px 16px', borderTop: '1px solid rgba(255,255,255,0.08)' }}>
        <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.08em', color: 'rgba(255,255,255,0.4)', marginBottom: 8 }}>DISTRICT SCOPE</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, background: 'rgba(255,255,255,0.06)', borderRadius: 9, padding: '9px 11px' }}>
          <div style={{ width: 30, height: 30, borderRadius: '50%', background: D.red, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700, flexShrink: 0 }}>RS</div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, whiteSpace: 'nowrap' }}>Dr. R. Sandhu</div>
            <div style={{ fontSize: 10.5, color: 'rgba(255,255,255,0.5)' }}>Ludhiana · CMHO</div>
          </div>
        </div>
        <div style={{ fontSize: 9.5, color: 'rgba(255,255,255,0.35)', marginTop: 9, lineHeight: 1.4 }}>
          Role-based access — you see Ludhiana district only.
        </div>
      </div>
    </aside>
  );
}

function Clock() {
  const [t, setT] = useState(new Date());
  useEffect(() => { const iv = setInterval(() => setT(new Date()), 1000); return () => clearInterval(iv); }, []);
  const hh = String(t.getHours()).padStart(2, '0');
  const mm = String(t.getMinutes()).padStart(2, '0');
  const ss = String(t.getSeconds()).padStart(2, '0');
  return <span style={{ fontFamily: DMONO, fontWeight: 600, fontSize: 13, color: D.ink }}>{hh}:{mm}<span style={{ color: D.faint }}>:{ss}</span></span>;
}

function Dashboard() {
  const [active, setActive] = useState('overview');
  const v = DASH_VIEWS[active];
  const View = v.render;
  return (
    <div style={{ display: 'flex', height: '100%', background: D.fog, fontFamily: DFONT }}>
      <Sidebar active={active} onChange={setActive} />
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        {/* topbar */}
        <header style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '15px 26px', background: D.panel, borderBottom: `1px solid ${D.line}`, flexShrink: 0 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 17, fontWeight: 700, color: D.ink, letterSpacing: '-0.01em' }}>{v.label}</div>
            <div style={{ fontSize: 11.5, color: D.faint }}>{v.sub}</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: D.steal, borderRadius: 100, padding: '6px 12px', flexShrink: 0 }}>
            <DPulse color={D.teal} size={7} /><span style={{ fontSize: 11.5, fontWeight: 600, color: D.teal, whiteSpace: 'nowrap' }}>Live · all systems nominal</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, paddingLeft: 4, borderLeft: `1px solid ${D.line}` }}>
            <span style={{ paddingLeft: 12 }}><Clock /></span>
          </div>
        </header>
        {/* scroll body */}
        <div style={{ flex: 1, overflow: 'auto', padding: '22px 26px 32px' }}>
          <View />
        </div>
      </div>
    </div>
  );
}

function Stage() {
  const FRAME_W = 1440, FRAME_H = 900;
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => {
      const pad = 48;
      const s = Math.min((window.innerWidth - pad) / FRAME_W, (window.innerHeight - pad) / FRAME_H, 1);
      setScale(s);
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  return (
    <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div style={{ width: FRAME_W * scale, height: FRAME_H * scale }}>
        <div style={{ transform: `scale(${scale})`, transformOrigin: 'top left', width: FRAME_W, height: FRAME_H }}>
          <ChromeWindow width={FRAME_W} height={FRAME_H} url="dashboard.vitallink.in/ludhiana"
            tabs={[{ title: 'VitalLink Command Center' }, { title: 'NHA · HFR Registry' }]} activeIndex={0}>
            <div style={{ position: 'relative', height: '100%' }}>
              <a href="RaktSetu Emergency Flow.html" style={{
                position: 'absolute', top: 14, right: 22, zIndex: 20, textDecoration: 'none',
                fontFamily: DFONT, fontSize: 12, fontWeight: 600, color: D.mid,
                background: D.panel, border: `1px solid ${D.line}`, borderRadius: 100, padding: '7px 14px',
              }}>← Open the mobile app demo</a>
              <Dashboard />
            </div>
          </ChromeWindow>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Stage />);
</script>
</body>
</html>
